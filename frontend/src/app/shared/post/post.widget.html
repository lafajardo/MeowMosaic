<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>{{post.title}}</mat-card-title>
        <mat-card-subtitle>{{post.date}}</mat-card-subtitle>
    </mat-card-header>
    <img [src]="post.image" alt="Post image.">
    <mat-card-content>
        <p>{{post.caption}}</p>
    </mat-card-content>
    <mat-card-actions class="like-container" align="end">
        <button (click)="openPostEditor()" mat-flat-button>Edit</button>

        <div class="inner-like-container">
            <button style="margin: 0; padding: 0;" mat-flat-button disabledInteractive="true">
                <mat-icon>thumb_up_off_alt</mat-icon>
            </button>
                    {{post.score}}
            <button style="margin: 0; padding: 0;" mat-flat-button>
                <mat-icon>thumb_down_off_alt</mat-icon>
            </button>
        </div>
    </mat-card-actions>
</mat-card>
