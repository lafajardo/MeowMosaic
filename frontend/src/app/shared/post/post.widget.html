<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>{{post.title}}</mat-card-title>
        <mat-card-subtitle>{{post.date}}</mat-card-subtitle>
    </mat-card-header>
    <img [src]="post.image" alt="Post image.">
    <mat-card-content>
        <p>{{post.caption}}</p>
    </mat-card-content>
    <mat-card-actions align="end">
        @if (canEdit) {
        <!-- Moving Button Inside of mat-card, check TS file in component for logic to import this button over -->
            <button (click)="openPostEditor()" mat-icon-button>
                <mat-icon>edit</mat-icon>
            </button>
        }
        <div class="post-widget-button">
            <button mat-icon-button>
                <mat-icon style="margin: 0; padding: 0;">thumb_up_off_alt</mat-icon>
            </button>
            <span>{{post.score}}</span>
            <button mat-icon-button>
                <mat-icon style="margin: 0; padding: 0;">thumb_down_off_alt</mat-icon>
            </button>
        </div>
    </mat-card-actions>
</mat-card>
