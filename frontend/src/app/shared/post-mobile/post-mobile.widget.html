<mat-card>
    <img mat-card-image [src]="post.image" [alt]="post.title">
    <mat-card-header>
        <mat-card-title>{{post.title}}</mat-card-title>
        <mat-card-subtitle>{{post.date}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <p>{{post.caption}}</p>
    </mat-card-content>
    <mat-card-actions>
        <button mat-flat-button>
            <mat-icon>thumb-up</mat-icon>
        </button>
        <button mat-flat-button>
            <mat-icon>thumb-down</mat-icon>
        </button>
    </mat-card-actions>
</mat-card>
