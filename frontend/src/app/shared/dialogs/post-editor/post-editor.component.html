<div class="dialog">
    <h2 mat-dialog-title>Post Editor</h2>
    <mat-dialog-content>
        <form [formGroup]="postEditorForm">
            <mat-form-field appearance="outline">
                <mat-label>title</mat-label>
                <input matInput formControlName="title">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>caption</mat-label>
                <textarea matInput formControlName="caption"></textarea>
            </mat-form-field>
        </form>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close>Cancel</button>
        <button mat-button [mat-dialog-close]="true">Save</button>
    </mat-dialog-actions>
</div>
