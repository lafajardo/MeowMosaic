<div class="dialog">
    <mat-dialog-content>
        <p>Are you sure? Deleting a post cannot be a undone.</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close>Cancel</button>
        <button mat-button (click)="delete()" [mat-dialog-close]="true">Delete</button>
    </mat-dialog-actions>
</div>
